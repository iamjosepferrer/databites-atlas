region:
  id: catalonia
  display_name: Catalonia
  province_codes: ["08", "17", "25", "43"]
  province_names:
    "08": Barcelona
    "17": Girona
    "25": Lleida
    "43": Tarragona

geometry:
  url: "https://www.ine.es/prodyser/cartografia/seccionado_2023.zip"
  year: 2023

simplification:
  tracts: 0.0001
  municipalities: 0.0002
  provinces: 0.0003

output:
  geo_dir: "../web/geo"
  data_dir: "../web/data"

# ── Data sources ───────────────────────────────────────────────────────────

sources:

  # ── Income (ADRH — all Spain in one file) ─────────────────────────────────
  ine_30824:
    url: "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/30824.csv"
    type: ine_atlas_renta
    label: "INE — Atlas de Distribución de Renta de los Hogares"
    variables:
      - id: net_income_pc
        indicator: "Renta neta media por persona"
        label_es: Renta neta media por persona
        label_ca: Renda neta mitjana per persona
        label_en: Net income per capita
        unit: "€"
        decimals: 0
        multiplier: 1000

      - id: net_income_hh
        indicator: "Renta neta media por hogar"
        label_es: Renta neta media por hogar
        label_ca: Renda neta mitjana per llar
        label_en: Net income per household
        unit: "€"
        decimals: 0
        multiplier: 1000

      - id: median_income_cu
        indicator: "Mediana de la renta por unidad de consumo"
        label_es: Mediana de la renta por unidad de consumo
        label_ca: Mediana de la renda per unitat de consum
        label_en: Median income per equivalent adult
        unit: "€"
        decimals: 0
        multiplier: 1000

      - id: gross_income_pc
        indicator: "Renta bruta media por persona"
        label_es: Renta bruta media por persona
        label_ca: Renda bruta mitjana per persona
        label_en: Gross income per capita
        unit: "€"
        decimals: 0
        multiplier: 1000

      - id: gross_income_hh
        indicator: "Renta bruta media por hogar"
        label_es: Renta bruta media por hogar
        label_ca: Renda bruta mitjana per llar
        label_en: Gross income per household
        unit: "€"
        decimals: 0
        multiplier: 1000

  # ── Employment — activity (Censo Anual, one file per province) ─────────────
  ine_censo_empleo:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66672.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66720.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66748.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66812.csv"  # 43 Tarragona
    type: ine_censo_anual
    label: "INE — Censo Anual de Población (relación con la actividad)"
    variables:
      - id: employment_rate
        ratio_numerator: "Ocupado/a"
        ratio_denominator: "Total"
        label_es: Tasa de empleo
        label_ca: "Taxa d'ocupació"
        label_en: Employment rate
        unit: "%"
        decimals: 1

      - id: unemployment_rate
        ratio_numerator: "Parado/a"
        ratio_denominator: "Total"
        label_es: Tasa de paro
        label_ca: "Taxa d'atur"
        label_en: Unemployment rate
        unit: "%"
        decimals: 1

      - id: pension_recipients_pct
        ratio_numerator: "Perceptor/a pensión de incapacidad, jubilación, prejubilación"
        ratio_denominator: "Total"
        label_es: Perceptores de pensión (incapacidad, jubilación)
        label_ca: Perceptors de pensió (incapacitat, jubilació)
        label_en: Pension / disability recipients
        unit: "%"
        decimals: 1

  # ── Education (Censo Anual, one file per province) ─────────────────────────
  ine_censo_educacion:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66670.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66718.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66746.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66810.csv"  # 43 Tarragona
    type: ine_censo_anual
    label: "INE — Censo Anual de Población (educación)"
    variables:
      - id: edu_primary_pct
        ratio_numerator: "Educación primaria e inferior"
        ratio_denominator: "Total"
        label_es: Educación primaria o inferior
        label_ca: Educació primària o inferior
        label_en: Primary education or below
        unit: "%"
        decimals: 1

      - id: edu_lower_secondary_pct
        ratio_numerator: "Primera etapa de Educación Secundaria y similar"
        ratio_denominator: "Total"
        label_es: Primera etapa de Educación Secundaria
        label_ca: Primera etapa d'Educació Secundària
        label_en: Lower secondary education
        unit: "%"
        decimals: 1

      - id: edu_upper_secondary_pct
        ratio_numerator: "Segunda etapa de Educación Secundaria y Educación Postsecundaria no Superior"
        ratio_denominator: "Total"
        label_es: Segunda etapa de Educación Secundaria
        label_ca: Segona etapa d'Educació Secundària
        label_en: Upper secondary education
        unit: "%"
        decimals: 1

      - id: edu_higher_pct
        ratio_numerator: "Educación superior"
        ratio_denominator: "Total"
        label_es: Educación superior
        label_ca: Educació superior
        label_en: Higher education
        unit: "%"
        decimals: 1

  # ── Occupation (Censo Anual, one file per province) ────────────────────────
  ine_censo_ocupacion:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70034.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70061.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70085.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70139.csv"  # 43 Tarragona
    type: ine_censo_anual
    label: "INE — Censo Anual de Población (ocupación)"
    variables:
      - id: occ_high_skill_pct
        ratio_numerator: "Directores/gerentes y profesionales/técnicos de nivel medio o alto"
        ratio_denominator: "Total"
        label_es: Ocupaciones de alta cualificación
        label_ca: Ocupacions d'alta qualificació
        label_en: High-skill occupations
        unit: "%"
        decimals: 1

      - id: occ_low_skill_pct
        ratio_numerator: "Trabajadores cualificados y oficiales/operarios de nivel bajo"
        ratio_denominator: "Total"
        label_es: Trabajadores cualificados de nivel bajo
        label_ca: Treballadors qualificats de nivell baix
        label_en: Low-skill qualified workers
        unit: "%"
        decimals: 1

      - id: occ_elementary_pct
        ratio_numerator: "Ocupaciones elementales"
        ratio_denominator: "Total"
        label_es: Ocupaciones elementales
        label_ca: Ocupacions elementals
        label_en: Elementary occupations
        unit: "%"
        decimals: 1

  # ── Economic activity sector (Censo Anual, one file per province) ──────────
  ine_censo_actividad:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70035.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70062.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70086.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70140.csv"  # 43 Tarragona
    type: ine_censo_anual
    label: "INE — Censo Anual de Población (rama de actividad)"
    variables:
      - id: sector_agriculture_pct
        ratio_numerator: "Agricultura, ganadería y pesca"
        ratio_denominator: "Total CNAE"
        label_es: Agricultura, ganadería y pesca
        label_ca: Agricultura, ramaderia i pesca
        label_en: Agriculture employment
        unit: "%"
        decimals: 1

      - id: sector_industry_pct
        ratio_numerator: "Industria"
        ratio_denominator: "Total CNAE"
        label_es: Industria
        label_ca: Indústria
        label_en: Industry employment
        unit: "%"
        decimals: 1

      - id: sector_construction_pct
        ratio_numerator: "Construcción"
        ratio_denominator: "Total CNAE"
        label_es: Construcción
        label_ca: Construcció
        label_en: Construction employment
        unit: "%"
        decimals: 1

      - id: sector_services_pct
        ratio_numerator: "Servicios"
        ratio_denominator: "Total CNAE"
        label_es: Servicios
        label_ca: Serveis
        label_en: Services employment
        unit: "%"
        decimals: 1

  # ── Professional status (Censo Anual, one file per province) ───────────────
  ine_censo_situacion_prof:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70036.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70063.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70087.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/70141.csv"  # 43 Tarragona
    type: ine_censo_anual
    label: "INE — Censo Anual de Población (situación profesional)"
    variables:
      - id: self_employed_pct
        ratio_numerator: "Trabajador por cuenta propia"
        ratio_denominator: "Total"
        label_es: Trabajadores por cuenta propia
        label_ca: Treballadors per compte propi
        label_en: Self-employed
        unit: "%"
        decimals: 1

      - id: employed_pct
        ratio_numerator: "Trabajador por cuenta ajena y otra situación"
        ratio_denominator: "Total"
        label_es: Trabajadores por cuenta ajena
        label_ca: Treballadors per compte aliè
        label_en: Employed (salaried)
        unit: "%"
        decimals: 1

  # ── Gini index (ADRH — one file per Catalan province) ────────────────────
  ine_gini:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/37686.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/37697.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/37704.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/37718.csv"  # 43 Tarragona
    type: ine_atlas_renta
    label: "INE — Atlas de Distribución de Renta de los Hogares (Gini)"
    variables:
      - id: gini
        indicator: "Índice de Gini"
        label_es: Índice de Gini
        label_ca: Índex de Gini
        label_en: Gini index (inequality)
        unit: "%"
        decimals: 1
        multiplier: 1
      
      - id: p80_p20
        indicator: "Distribución de la renta P80/P20"
        label_es: Distribución de la renta P80/P20
        label_ca: Distribució de la renda P80/P20
        label_en: P80/P20 income ratio
        unit: ""
        decimals: 2
        multiplier: 1

  # ── Income distribution — poverty (ADRH, one file per province, 7-col format) ─
  ine_poverty_euros:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/30898.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/31018.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/31081.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/31225.csv"  # 43 Tarragona
    type: ine_censo_anual
    label: "INE — Atlas de Distribución de Renta de los Hogares (distribución por euros)"
    variables:
      - id: poverty_10k_pct
        indicator: "Población con ingresos por unidad de consumo por debajo de 10.000 Euros"
        label_es: Población con ingresos por debajo de 10.000€
        label_ca: Població amb ingressos per sota 10.000€
        label_en: Population with income below €10,000
        unit: "%"
        decimals: 1
        multiplier: 1
 
  ine_poverty_median:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/30901.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/31021.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/31084.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/31228.csv"  # 43 Tarragona
    type: ine_censo_anual
    label: "INE — Atlas de Distribución de Renta de los Hogares (distribución por mediana)"
    variables:
      - id: poverty_60_median_pct
        indicator: "Población con ingresos por unidad de consumo por debajo 60% de la mediana"
        label_es: Población con ingresos por debajo 60% de la mediana
        label_ca: Població amb ingressos per sota 60% de la mediana
        label_en: Population below 60% median income
        unit: "%"
        decimals: 1
        multiplier: 1
  # ── Population — birth country (Padrón Municipal, one file per province) ──
  ine_padron_nacimiento:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66386.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66410.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66424.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66456.csv"  # 43 Tarragona
    type: ine_censo_anual
    label: "INE — Padrón Municipal (país de nacimiento)"
    variables:
      - id: pop_total
        indicator: "Total"
        label_es: Población total
        label_ca: Població total
        label_en: Total population
        unit: ""
        decimals: 0
        multiplier: 1
      - id: foreign_born_pct
        ratio_complement_numerator: "España"
        ratio_denominator: "Total"
        label_es: Población nacida en el extranjero
        label_ca: Població nascuda a l'estranger
        label_en: Foreign-born population
        unit: "%"
        decimals: 1
      - id: foreign_americas_pct
        ratio_numerator: "Otros países de América"
        ratio_denominator: "Total"
        label_es: Nacidos en América
        label_ca: Nascuts a Amèrica
        label_en: Born in the Americas
        unit: "%"
        decimals: 1
      - id: foreign_africa_pct
        ratio_numerator: "Otros países de África"
        ratio_denominator: "Total"
        label_es: Nacidos en África
        label_ca: Nascuts a l'Àfrica
        label_en: Born in Africa
        unit: "%"
        decimals: 1
      - id: foreign_asia_pct
        ratio_numerator: "Otros países de Asia"
        ratio_denominator: "Total"
        label_es: Nacidos en Asia
        label_ca: Nascuts a Àsia
        label_en: Born in Asia
        unit: "%"
        decimals: 1
      - id: foreign_europe_pct
        ratio_numerator: "Otros países de Europa"
        ratio_denominator: "Total"
        label_es: Nacidos en Europa (excl. España)
        label_ca: Nascuts a Europa (excl. Espanya)
        label_en: Born in Europe (excl. Spain)
        unit: "%"
        decimals: 1

  # ── Population — gender (% males) ────────────────────────────────────────
  ine_padron_gender:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66386.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66410.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66424.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/66456.csv"  # 43 Tarragona
    type: ine_padron_gender
    label: "INE — Padrón Municipal (distribución por sexo)"
    variables:
      - id: gender_ratio
        ratio_numerator: "hombres"
        ratio_denominator: "Total"
        label_es: Porcentaje de hombres
        label_ca: Percentatge d'homes
        label_en: Male population (%)
        unit: "%"
        decimals: 1

  # ── Population — age groups (Padrón Municipal, one file per province) ──────
  ine_padron_edad:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/69129.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/69177.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/69205.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/69269.csv"  # 43 Tarragona
    type: ine_censo_anual
    label: "INE — Padrón Municipal (grupos de edad)"
    variables:
      - id: pop_under15_pct
        ratio_sum_numerators:
          - "De 0 a 4 años"
          - "De 5 a 9 años"
          - "De 10 a 14 años"
        ratio_denominator: "Todas las edades"
        label_es: Población menor de 15 años
        label_ca: Població menor de 15 anys
        label_en: Population under 15
        unit: "%"
        decimals: 1
      - id: pop_15_64_pct
        ratio_sum_numerators:
          - "De 15 a 19 años"
          - "De 20 a 24 años"
          - "De 25 a 29 años"
          - "De 30 a 34 años"
          - "De 35 a 39 años"
          - "De 40 a 44 años"
          - "De 45 a 49 años"
          - "De 50 a 54 años"
          - "De 55 a 59 años"
          - "De 60 a 64 años"
        ratio_denominator: "Todas las edades"
        label_es: Población de 15 a 64 años
        label_ca: Població de 15 a 64 anys
        label_en: Population aged 15–64
        unit: "%"
        decimals: 1
      - id: pop_65plus_pct
        ratio_sum_numerators:
          - "De 65 a 69 años"
          - "De 70 a 74 años"
          - "De 75 a 79 años"
          - "De 80 a 84 años"
          - "De 85 a 89 años"
          - "De 90 a 94 años"
          - "De 95 a 99 años"
          - "100 y más años"
        ratio_denominator: "Todas las edades"
        label_es: Población de 65 años o más
        label_ca: Població de 65 anys o més
        label_en: Population aged 65+
        unit: "%"
        decimals: 1
    pyramid_bands:
      denominator: "Todas las edades"
      bands:
        - { id: age_0_4,   indicator: "De 0 a 4 años"   }
        - { id: age_5_9,   indicator: "De 5 a 9 años"   }
        - { id: age_10_14, indicator: "De 10 a 14 años" }
        - { id: age_15_19, indicator: "De 15 a 19 años" }
        - { id: age_20_24, indicator: "De 20 a 24 años" }
        - { id: age_25_29, indicator: "De 25 a 29 años" }
        - { id: age_30_34, indicator: "De 30 a 34 años" }
        - { id: age_35_39, indicator: "De 35 a 39 años" }
        - { id: age_40_44, indicator: "De 40 a 44 años" }
        - { id: age_45_49, indicator: "De 45 a 49 años" }
        - { id: age_50_54, indicator: "De 50 a 54 años" }
        - { id: age_55_59, indicator: "De 55 a 59 años" }
        - { id: age_60_64, indicator: "De 60 a 64 años" }
        - { id: age_65_69, indicator: "De 65 a 69 años" }
        - { id: age_70_74, indicator: "De 70 a 74 años" }
        - { id: age_75_79, indicator: "De 75 a 79 años" }
        - { id: age_80_84, indicator: "De 80 a 84 años" }
        - { id: age_85_89, indicator: "De 85 a 89 años" }
        - { id: age_90_94, indicator: "De 90 a 94 años" }
        - { id: age_95_99, indicator: "De 95 a 99 años" }
        - { id: age_100p,  indicator: "100 y más años"  }
  # ── Population — age by gender (Padrón Municipal, one file per province) ───
  ine_padron_edad_gender:
    urls:
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/69129.csv"  # 08 Barcelona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/69177.csv"  # 17 Girona
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/69205.csv"  # 25 Lleida
      - "https://www.ine.es/jaxiT3/files/t/es/csv_bdsc/69269.csv"  # 43 Tarragona
    type: ine_padron_edad_gender
    label: "INE — Padrón Municipal (grupos de edad por sexo)"
    variables: []
    pyramid_bands:
      denominator: "Todas las edades"
      bands:
        - { id: age_m_0_4,    indicator: "m_De 0 a 4 años"    }
        - { id: age_f_0_4,    indicator: "f_De 0 a 4 años"    }
        - { id: age_m_5_9,    indicator: "m_De 5 a 9 años"    }
        - { id: age_f_5_9,    indicator: "f_De 5 a 9 años"    }
        - { id: age_m_10_14,  indicator: "m_De 10 a 14 años"  }
        - { id: age_f_10_14,  indicator: "f_De 10 a 14 años"  }
        - { id: age_m_15_19,  indicator: "m_De 15 a 19 años"  }
        - { id: age_f_15_19,  indicator: "f_De 15 a 19 años"  }
        - { id: age_m_20_24,  indicator: "m_De 20 a 24 años"  }
        - { id: age_f_20_24,  indicator: "f_De 20 a 24 años"  }
        - { id: age_m_25_29,  indicator: "m_De 25 a 29 años"  }
        - { id: age_f_25_29,  indicator: "f_De 25 a 29 años"  }
        - { id: age_m_30_34,  indicator: "m_De 30 a 34 años"  }
        - { id: age_f_30_34,  indicator: "f_De 30 a 34 años"  }
        - { id: age_m_35_39,  indicator: "m_De 35 a 39 años"  }
        - { id: age_f_35_39,  indicator: "f_De 35 a 39 años"  }
        - { id: age_m_40_44,  indicator: "m_De 40 a 44 años"  }
        - { id: age_f_40_44,  indicator: "f_De 40 a 44 años"  }
        - { id: age_m_45_49,  indicator: "m_De 45 a 49 años"  }
        - { id: age_f_45_49,  indicator: "f_De 45 a 49 años"  }
        - { id: age_m_50_54,  indicator: "m_De 50 a 54 años"  }
        - { id: age_f_50_54,  indicator: "f_De 50 a 54 años"  }
        - { id: age_m_55_59,  indicator: "m_De 55 a 59 años"  }
